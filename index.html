  <style>
    /* ห้ามใส่พื้นหลังให้ body: ภาพจากกล้องอยู่ชั้นล่างสุด พื้นหลัง body จะบังกล้องจนดำ */
    html { background: #000; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Noto Sans Thai", sans-serif; }
    body { background: transparent; }
    .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
    #yt-btn {
      position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(140%);
      z-index: 9999; display: flex; align-items: center; gap: 10px;
      padding: 14px 24px; border-radius: 999px; border: 0;
      background: #ff0033; color: #fff; font-size: 17px; font-weight: 700;
      text-decoration: none; box-shadow: 0 6px 24px rgba(0,0,0,.45);
      transition: transform .25s ease, opacity .25s ease; opacity: 0; white-space: nowrap;
    }
    #yt-btn.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #yt-btn svg { width: 22px; height: 22px; flex: none; }
    #hint {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      z-index: 9999; padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,.55);
      color: #fff; font-size: 14px; text-align: center; max-width: 88vw; transition: opacity .3s;
    }
    #start {
      position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
      background: #3d8f2a; color: #fff; padding: 0; box-sizing: border-box;
    }
    #start .box { text-align: center; max-width: 360px; width: 100%; }
    #start .icon { font-size: 64px; filter: drop-shadow(0 6px 10px rgba(120,70,0,.35)); }
    #start .title { font-size: 26px; font-weight: 800; margin: 14px 0 0; color: #2b1d00; }
    #mascot { position: fixed; inset: 0; overflow: hidden; }
    #mascot img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
    #mascot-bg { position: absolute; inset: -40px; background-size: cover; background-position: center;
      filter: blur(28px) brightness(.8); }
    /* ปุ่มล่องหนวางทับลิ้น */
    #start-btn {
      position: absolute; left: 0; top: 0; width: 0; height: 0;
      border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn::after { content: ''; position: absolute; inset: -4%; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.95); box-shadow: 0 0 18px rgba(255,255,255,.9);
      animation: ping 1.4s ease-out infinite; }
    #start-btn:active { transform: scale(.94); }
    #start-msg:empty { display: none; }
    #start-btn:disabled::after { animation-duration: .5s; }
    #start-btn:disabled { cursor: progress; }
    #mascot:has(#start-btn:disabled) img { filter: brightness(.85); }
    @keyframes ping { 0% { transform: scale(.75); opacity: .95; } 100% { transform: scale(1.15); opacity: 0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #gold-link { display: block; margin-top: 12px; padding: 18px; border-radius: 16px; font-size: 19px; font-weight: 800;
      text-decoration: none; background: linear-gradient(#ffe27a, #d9a21b); color: #3a2600; box-shadow: 0 8px 30px rgba(255,200,60,.35); }
    #tap-hint { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(140%);
      z-index: 9999; padding: 12px 22px; border-radius: 999px; background: #1e88e5; color: #fff; font-size: 17px; font-weight: 800;
      box-shadow: 0 6px 24px rgba(0,0,0,.35); opacity: 0; transition: transform .25s, opacity .25s; pointer-events: none; }
    #tap-hint.show { transform: translateX(-50%) translateY(0); opacity: 1; animation: tapPulse 1.2s ease-in-out infinite; }
    @keyframes tapPulse { 50% { transform: translateX(-50%) scale(1.07); } }
    #scare { position: fixed; inset: 0; z-index: 9998; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(255,0,0,0) 30%, rgba(160,0,0,.85) 100%); }
    #scare.on { animation: scare .9s ease-out; }
    @keyframes scare { 0%{opacity:1;background-color:rgba(255,255,255,.6)} 15%{opacity:1;background-color:transparent} 100%{opacity:0} }    #start-msg { position: fixed; left: 16px; right: 16px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 2; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.92); margin-top: 0; font-size: 15px; line-height: 1.55; color: #7a1500; font-weight: 600; white-space: pre-line; }
  </style>

  <script>
    // ---------- วางปุ่มล่องหนให้ตรงลิ้นเสมอ (เห็นภาพเต็มตัว แบบ contain) ----------
    // ตำแหน่งลิ้นในภาพ (สัดส่วน 0..1): ซ้าย, บน, กว้าง, สูง
    const TONGUE = { x: 0.252, y: 0.53, w: 0.411, h: 0.125 };
    function placeTongue() {
      const img = document.querySelector('#mascot img'), b = document.getElementById('start-btn');
      if (!img || !img.naturalWidth) return;
      const W = innerWidth, H = innerHeight, iw = img.naturalWidth, ih = img.naturalHeight;
      const k = Math.max(W / iw, H / ih), dw = iw * k, dh = ih * k, ox = (W - dw) / 2, oy = (H - dh) / 2;
      Object.assign(b.style, { left: ox + TONGUE.x * dw + 'px', top: oy + TONGUE.y * dh + 'px',
        width: TONGUE.w * dw + 'px', height: TONGUE.h * dh + 'px' });
    }
    addEventListener('resize', placeTongue);
    { const img = document.querySelector('#mascot img'); img.complete ? placeTongue() : img.addEventListener('load', placeTongue); }
  </script>

  <script>
    // ---------- เอฟเฟกต์สายฟ้า + แถบพลังงาน (วาดลง canvas ทุกเฟรม) ----------
    AFRAME.registerComponent('zap-effect', {
      schema: { aspect: { default: 0.3 } },
      init() {
        const W = 1024, H = 640;
        this.canvas = Object.assign(document.createElement('canvas'), { width: W, height: H });
        this.ctx = this.canvas.getContext('2d');
        // พื้นที่เอฟเฟกต์กว้างกว่าภาพ 1.6 เท่า ให้สายฟ้าแลบออกนอกตัวถ่านได้
        this.planeW = 1.6;
        this.planeH = this.planeW * H / W;
        this.texture = new THREE.CanvasTexture(this.canvas);
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(this.planeW, this.planeH),
          new THREE.MeshBasicMaterial({ map: this.texture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
        );
        mesh.position.z = 0.01;
        this.el.setObject3D('mesh', mesh);
        this.start = performance.now(); this.last = 0; this.bolts = [];
        this.el.parentNode.addEventListener('targetFound', () => { this.start = performance.now(); });
      },
      // สายฟ้าแบบหยัก (midpoint displacement)
      bolt(x1, y1, x2, y2, rough) {
        let pts = [[x1, y1], [x2, y2]];
        for (let i = 0; i < 6; i++) {
          const next = [pts[0]];
          for (let j = 0; j < pts.length - 1; j++) {
            const [ax, ay] = pts[j], [bx, by] = pts[j + 1];
            const mx = (ax + bx) / 2, my = (ay + by) / 2;
            const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
            const off = (Math.random() - 0.5) * rough * len / 2;
            next.push([mx - dy / len * off, my + dx / len * off], pts[j + 1]);
          }
          pts = next;
        }
        return pts;
      },
      drawPath(pts, width, color, blur) {

      sample(fx, fy) {
        const sys = this.el.sceneEl.systems['mindar-image-system']; const video = sys && sys.video;
        const cam = this.el.sceneEl.camera; if (!video || !cam || !video.videoWidth) return null;
        const asp = this.data.aspect;
        const pt = new THREE.Vector3(fx - 0.5, asp / 2 - fy * asp, 0);
        this.el.parentNode.object3D.localToWorld(pt); pt.project(cam);
        const canvas = this.el.sceneEl.canvas.getBoundingClientRect();
        const sx = canvas.left + (pt.x + 1) / 2 * canvas.width, sy = canvas.top + (1 - pt.y) / 2 * canvas.height;
        const r = video.getBoundingClientRect();
        const vx = (sx - r.left) / r.width * video.videoWidth, vy = (sy - r.top) / r.height * video.videoHeight;
        if (vx < 4 || vy < 4 || vx > video.videoWidth - 4 || vy > video.videoHeight - 4) return null;

        for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; }

        if (h >= 280 || h < 20) return 'pink';

        }, SPARKLE_FIRST * 1000);
      });
      target.addEventListener('targetLost', () => clearTimeout(revealTimer));

      target.addEventListener('targetFound', () => {
        clearTimeout(hideTimer);
        window.AR_TARGET_VISIBLE = true;
        hint.style.opacity = 0;
        if (navigator.vibrate) navigator.vibrate(cfg.effect === 'zap' ? [60, 40, 120] : 40);
        if (cfg.link) { setButton(cfg.link); btn.classList.add('show'); }
        else btn.classList.remove('show');
      });
      target.addEventListener('targetLost', () => {
        window.AR_TARGET_VISIBLE = false;
        // ค้างปุ่มไว้ 4 วินาที เผื่อคนดูเลื่อนกล้องออกก่อนกด
        hideTimer = setTimeout(() => { btn.classList.remove('show'); hint.style.opacity = 1; }, 4000);
      });
      scene.appendChild(target);
    });



    // ---------- ปุ่มเปิดกล้อง + แจ้งสาเหตุถ้าเปิดไม่ได้ ----------
    const startEl = document.getElementById('start');
    const startBtn = document.getElementById('start-btn');
    const startMsg = document.getElementById('start-msg');
    const ua = navigator.userAgent;
    const inApp = /Line\/|FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger|TikTok/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const openInText = isIOS ? 'Safari' : 'Chrome';

    if (inApp) {
      startMsg.textContent = `คุณกำลังเปิดในแอป (เช่น LINE / Facebook) ซึ่งมักเปิดกล้องไม่ได้\nกดเมนู ⋯ แล้วเลือก "เปิดใน ${openInText}"`;
    }

    function showError(err) {
      startEl.style.display = 'flex';
      startBtn.disabled = false;
      const name = err && err.name || '';
      let msg;
      if (!window.isSecureContext) msg = 'ต้องเปิดผ่านลิงก์ https เท่านั้น';
      else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        msg = inApp ? `แอปนี้ไม่รองรับกล้อง กด ⋯ แล้วเลือก "เปิดใน ${openInText}"` : `เบราว์เซอร์นี้ไม่รองรับกล้อง ลองเปิดใน ${openInText}`;
      else if (name === 'NotAllowedError' || name === 'SecurityError')
        msg = isIOS
          ? 'ยังไม่ได้อนุญาตกล้อง\nไปที่ ตั้งค่า > Safari > กล้อง > เลือก "อนุญาต" หรือ "ถาม" แล้วโหลดหน้านี้ใหม่'
          : 'ยังไม่ได้อนุญาตกล้อง\nกดไอคอนแม่กุญแจ/การตั้งค่าที่แถบลิงก์ > สิทธิ์ > กล้อง > อนุญาต แล้วโหลดหน้านี้ใหม่';
      else if (name === 'NotFoundError' || name === 'OverconstrainedError') msg = 'ไม่พบกล้องในเครื่องนี้';
      else if (name === 'NotReadableError') msg = 'กล้องถูกแอปอื่นใช้อยู่ ปิดแอปกล้อง/วิดีโอคอลแล้วลองใหม่';
      else msg = 'เปิดกล้องไม่ได้ (' + (name || err || 'unknown') + ')\nลองเปิดลิงก์นี้ใน ' + openInText;
      startMsg.textContent = msg;
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true; startMsg.textContent = '';
      try {
        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');
        // ขอสิทธิ์กล้องจากการแตะของผู้ใช้โดยตรง (iPhone ต้องการแบบนี้)
        SFX.unlock(); // ปลดล็อกเสียงจากการแตะ (มือถือบังคับ)
        if (window.unlockCardVideos) window.unlockCardVideos();
        if (window.unlockVoices) window.unlockVoices();
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        s.getTracks().forEach(t => t.stop());
        const go = () => {
          startEl.style.display = 'none'; hint.style.opacity = 1;
          const sys = scene.systems['mindar-image-system'];
          sys.start();
        };
        scene.hasLoaded ? go() : scene.addEventListener('loaded', go, { once: true });
      } catch (e) { showError(e); }
    });
    scene.addEventListener('arError', () => showError({ name: 'arError' }));
  </script>
</body>
</html>
